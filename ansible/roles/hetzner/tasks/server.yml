---
- name: Create hetzner cloud server
  hetzner.hcloud.server:
    api_token: "{{ hcloud_token }}"
    name: "{{ server_name }}"
    server_type: "{{ server_type }}"
    location: "{{ server_location }}"
    image: "{{ server_os_image }}"
    state: "present"
    backups: "{{ server_backups }}"
    delete_protection: true
    rebuild_protection: true
    enable_ipv4: true
    enable_ipv6: true
    firewalls: >-
      {{
      [server_firewall_mailcow_name]
      + ([server_firewall_ssh_name] if (server_firewall_ssh_enabled | default(false) | bool) else [])
      + (server_extra_firewalls | default([]))
      }}
    ssh_keys: "{{ server_ssh_keys | map(attribute='name') | list }}"
  register: server

- name: Register server information
  ansible.builtin.set_fact:
    server_ipv4_address: "{{ server.hcloud_server.ipv4_address }}"
    server_ipv6_address: "{{ server.hcloud_server.ipv6 | ansible.utils.ipaddr('1') | ansible.utils.ipaddr('address') }}"
    server_floating_ips: >-
      {{
      ([{'name': server_floating_ipv4, 'type': 'ipv4'}] if server_floating_ipv4 else [])
      + ([{'name': server_floating_ipv6, 'type': 'ipv6'}] if server_floating_ipv6 else [])
      }}
