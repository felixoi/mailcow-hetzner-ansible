---
- name: Create mailcow firewall resource
  hetzner.hcloud.firewall:
    api_token: "{{ hcloud_token }}"
    name: "{{ server_firewall_mailcow_name }}"
    rules: >-
      {{ server_firewall_mailcow_ports | map('combine', {
           'direction': 'in',
           'protocol': 'tcp',
           'source_ips': ['0.0.0.0/0', '::/0']
         }) | list }}
    state: present

- name: Create ssh firewall resource
  when: server_firewall_ssh_enabled | bool
  hetzner.hcloud.firewall:
    api_token: "{{ hcloud_token }}"
    name: "{{ server_firewall_ssh_name }}"
    rules:
      - description: SSH
        direction: in
        protocol: tcp
        port: "22"
        source_ips:
          - 0.0.0.0/0
          - ::/0
    state: present
