---
name: Lint

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # ansible-lint needs the mailcow role to check the playbook
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install linters
        run: pip install ansible-lint==26.11.0 yamllint==1.38.0

      - name: Install Ansible roles and collections
        run: ansible-galaxy install -r ansible/requirements.yml

      - name: Run yamllint
        run: yamllint --strict .

      - name: Run ansible-lint
        run: ansible-lint
